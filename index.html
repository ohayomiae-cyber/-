<style>
:root{--ink:#151d26;--ink2:#1c2630;--ink3:#27333e;--ln:#3a4855;--tx:#e7e2d4;--mu:#97a1a7;--acc:#c4532d;--acc2:#e07a4f;--ok:#7fa36f;--bad:#e0745a;--paper:#ece2c8;--paper2:#f2ebd8;--pink:#211c16;--sea:#a7b9be;--serif:'Noto Serif KR','Nanum Myeongjo',serif;--sans:'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;color-scheme:dark}

:root[data-theme=dark]{--ink:#151d26;--tx:#e7e2d4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--tx);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button{font:600 13px/1 var(--sans);color:var(--tx);background:var(--ink3);border:1px solid #475563;border-radius:2px;padding:0 12px;height:34px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:#6a7884}button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc2);color:#fff}button.on{background:#e9e3d2;color:#151b22;border-color:#fff}
input,select{font:500 13px var(--sans);color:var(--tx);background:var(--ink3);border:1px solid #475563;border-radius:2px;height:32px;padding:0 8px}
.num{font-variant-numeric:tabular-nums}
/* ── 로딩·타이틀·메뉴 (고풍 지도책) ── */
:root{--parch:#ecdfbf;--parch2:#e2d2ab;--sepia:#2a1f14;--brass:#b39a68;--ox:#7d2417;--ox2:#a3361b;--type:'Special Elite','Courier New',monospace;--noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .12 0 0 0 .55 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}
.logo{font-family:'IM Fell English SC','IM Fell English',Georgia,serif;font-weight:400;color:#f1e6c8;letter-spacing:.02em;line-height:.95;margin:0}

.ppr{background:var(--parch) var(--noise);color:var(--sepia);border:1px solid #7a6440;box-shadow:inset 0 0 70px rgba(122,88,38,.28),0 8px 26px rgba(0,0,0,.55)}
.orn{position:relative;outline:1px solid var(--brass);outline-offset:6px}
.orn>.cn{position:absolute;width:34px;height:34px;pointer-events:none}.orn>.cn path{fill:none;stroke:var(--brass);stroke-width:1.3}
.orn>.c1{left:-12px;top:-12px}.orn>.c2{right:-12px;top:-12px;transform:scaleX(-1)}.orn>.c3{left:-12px;bottom:-12px;transform:scaleY(-1)}.orn>.c4{right:-12px;bottom:-12px;transform:scale(-1)}
#splash{position:fixed;inset:0;z-index:100;background:#1b140d var(--noise);display:grid;place-items:center;color:#f1e6c8;transition:opacity .7s ease,visibility .7s;overflow:hidden}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-map{position:absolute;inset:-3%;opacity:0;transition:opacity 1.6s ease;filter:sepia(.6) brightness(.55) contrast(1.05)}#splash .sp-map.on{opacity:.55}#splash .sp-map img{width:100%;height:100%;object-fit:cover}
#splash .sp-vig{position:absolute;inset:0;background:radial-gradient(ellipse 70% 62% at 50% 48%,transparent,rgba(16,11,6,.92) 78%)}
.sp-in{position:relative;text-align:center;width:min(640px,88vw)}

.sp-rule{display:flex;align-items:center;gap:14px;margin:16px auto 10px;width:80%;font:400 12px 'IM Fell English',serif;letter-spacing:.3em;color:var(--brass)}.sp-rule::before,.sp-rule::after{content:'';flex:1;border-top:1px solid var(--brass)}
.sp-sub{font:600 14px var(--serif);letter-spacing:.34em;color:#d8cba8}
.sp-scale{margin:30px auto 0;width:min(460px,80vw)}
.sp-cells{display:grid;grid-template-columns:repeat(10,1fr);height:9px;border:1px solid #d8cba8}.sp-cells i{border-right:1px solid #d8cba8;transition:background .35s}.sp-cells i:last-child{border-right:0}.sp-cells i.f:nth-child(odd){background:#f1e6c8}.sp-cells i.f:nth-child(even){background:#3a2c1d}
.sp-lbl{display:flex;justify-content:space-between;font:400 11px var(--type);color:#bfb18d;margin-top:5px;letter-spacing:.06em}
.sp-st{display:flex;justify-content:space-between;font:500 12.5px var(--sans);color:#cbbd98;margin:14px auto 0;width:min(460px,80vw)}
.sp-q{margin-top:26px;font:italic 400 15px 'IM Fell English',var(--serif);color:#e9dcb9;min-height:22px;transition:opacity .4s}.sp-q b{font:600 13px var(--serif);font-style:normal;color:var(--brass);margin-right:8px}
.scr{position:fixed;inset:0;overflow:hidden;background:#1b140d;color:var(--tx)}

.scr-bg img,.scr-bg svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scr-bg img{filter:sepia(.45) brightness(.82)}

.rts path{fill:none;stroke:#c8553a;stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-dasharray:6 5;opacity:.9}.rts circle{fill:#f1e6c8}
.scr-c{position:relative;height:100%;overflow:auto}

.ttl-ink{display:block;width:min(560px,70vw);height:22px;margin:4px auto 0}.ttl-ink path{fill:none;stroke:#c8553a;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:700;stroke-dashoffset:700;animation:ink 1.6s .4s ease forwards}

.ttl-ko{font:600 clamp(15px,2vw,19px) var(--serif);letter-spacing:.32em;color:#e3d6b4;margin:16px 0 0}

.mb{height:56px;font:700 16px var(--serif);letter-spacing:.14em;background:var(--parch) var(--noise);color:var(--sepia);border:1px solid #5d4a2c;border-radius:0;box-shadow:inset 0 0 0 4px var(--parch),inset 0 0 0 5px #8b744c,0 4px 0 rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .12s,filter .12s}
.mb:hover{filter:brightness(1.06);transform:translateY(-1px)}.mb span{font-family:'IM Fell English',serif;font-size:20px;color:var(--ox)}
.mb.pri{background:var(--ox) var(--noise);color:#f6ead0;border-color:#3c0f08;box-shadow:inset 0 0 0 4px var(--ox),inset 0 0 0 5px #d9a27c,0 4px 0 rgba(0,0,0,.45)}.mb.pri span{color:#f6ead0}
.ttl-foot{position:absolute;bottom:22px;left:0;right:0;font:400 12px var(--type);color:#a99a76;letter-spacing:.14em}
.scr-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:16px;padding:12px 24px;background:rgba(22,16,10,.92);border-bottom:1px solid #5d4a2c}
.scr-h .logo{font-size:26px;flex:1}.scr-h button{height:36px;font:600 13px var(--serif);background:transparent;border-color:#6b5636;color:#e9dcb9}
.scr-h .rc{display:flex;align-items:center;gap:10px;font:500 13px var(--serif);color:#bfb18d}.scr-h .rc b{font:400 22px var(--type);letter-spacing:.12em;color:#f1e6c8}
.mw{max-width:1200px;margin:0 auto;padding:30px 24px 44px}
.mt{font:700 32px var(--serif);margin:0 0 4px;color:#f1e6c8}.ms{color:#cbbd98;font:400 15px var(--serif);margin:0 0 24px}
.lab2{font:400 13px var(--type);letter-spacing:.24em;color:var(--brass);margin:28px 0 12px;display:flex;align-items:center;gap:12px}.lab2::after{content:'';flex:1;border-top:1px solid #5d4a2c}
.scn{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.sc{height:auto;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:22px 22px 18px;border-radius:0;min-height:270px;position:relative;transition:transform .15s}

.sc .yr{font-family:'IM Fell English SC',Georgia,serif;font-size:56px;line-height:1;color:#2a1f14}
.sc h3{font:900 21px var(--serif);margin:10px 0 8px;color:#2a1f14}.sc p{font:400 14px/1.7 var(--serif);color:#4a3a26;margin:0 0 14px;flex:1}
.sc .fls{display:flex;gap:5px;flex-wrap:wrap}.sc .tn{font:400 12.5px var(--type);color:#5d4a2c;margin-top:12px}
.sc .stp{position:absolute;right:16px;bottom:18px;font:900 15px var(--serif);color:var(--ox2);border:2.5px solid var(--ox2);padding:4px 10px;transform:rotate(-8deg);opacity:0;letter-spacing:.2em}.sc.on .stp{opacity:.85}
.mfrm{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;padding:20px 22px;margin-top:18px}
.fld label{display:block;font:400 12.5px var(--type);color:#5d4a2c;margin-bottom:8px;letter-spacing:.12em}
.fld .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fld input{height:46px;font:400 22px var(--type);letter-spacing:.16em;text-transform:uppercase;width:210px;background:#f8f0dc;color:#2a1f14;border:1px solid #7a6440;border-radius:0}
.chip{height:42px;padding:0 15px;font:600 14px var(--serif);background:transparent;color:#2a1f14;border:1px solid #7a6440;border-radius:0}.chip:hover{background:#f8f0dc}.chip.on{background:#2a1f14;color:var(--parch);border-color:#2a1f14}
.big{height:54px;padding:0 32px;font:700 16px var(--serif);letter-spacing:.1em;border-radius:0}
.big.pri,.ppr button.pri{background:var(--ox);border-color:#3c0f08;color:#f6ead0;box-shadow:inset 0 0 0 3px var(--ox),inset 0 0 0 4px #d9a27c}
.big:disabled{opacity:.45}
.note2{color:#5d4a2c;font:400 14px/1.6 var(--serif);margin-top:14px}.scr .mw>.note2{color:#bfb18d}
.lob{display:grid;grid-template-columns:minmax(300px,370px) 1fr;gap:22px;align-items:start}
.lob-l{max-height:calc(100vh - 170px);display:flex;flex-direction:column}
.lob-l input{margin:14px 14px 6px;height:40px;font:500 14px var(--serif);background:#f8f0dc;color:#2a1f14;border:1px solid #7a6440;border-radius:0}
.lob-ls{overflow:auto;padding:0 8px 12px}
.seg{font:400 12px var(--type);letter-spacing:.2em;color:#7a2a1a;padding:16px 8px 6px;border-bottom:1.5px solid #2a1f14;margin-bottom:2px}
.nt{width:100%;height:auto;display:flex;align-items:center;gap:12px;text-align:left;padding:9px 8px;background:transparent;border:0;border-bottom:1px solid #c9b78f;border-radius:0;color:#2a1f14}
.nt:hover{background:#00000008}.nt.on{background:#2a1f14;color:var(--parch)}.nt.on small{color:#cbbd98}
.nt b{display:block;font:700 15px var(--serif)}.nt small{display:block;font:400 12.5px var(--serif);color:#5d4a2c;margin-top:2px}.nt>span{flex:1;min-width:0}
.nt .who{font:400 10.5px var(--type);letter-spacing:.06em;padding:3px 6px;border:1px solid currentColor;color:#a3361b}.nt.on .who{color:#e9a487}
.brief{position:relative;padding:26px 30px 28px}
.brief-hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double #2a1f14;padding-bottom:8px;font:400 12px var(--type);letter-spacing:.14em;color:#5d4a2c}.brief-hd b{font:400 14px var(--type);color:#7a2a1a;letter-spacing:.3em}
.brief-top{display:grid;grid-template-columns:auto 1fr 280px;gap:20px;align-items:start;margin-top:18px}

.brief h2{font:900 34px/1.15 var(--serif);margin:0;color:#2a1f14}
.brief .gv{font:400 14px var(--serif);color:#5d4a2c;margin-top:4px}
.photo{border:1px solid #2a1f14;background:#a7b9be;padding:0;box-shadow:2px 3px 0 rgba(0,0,0,.25)}.photo img{display:block;width:100%;height:160px;object-fit:cover;filter:sepia(.35)}.photo figcaption{font:400 11px var(--type);color:#5d4a2c;padding:4px 6px;background:var(--parch2)}
.brief table{width:100%;border-collapse:collapse;margin-top:14px;font:400 14px var(--serif)}.brief td{padding:5px 0;border-bottom:1px dotted #9c8a64;vertical-align:top}.brief td:first-child{width:96px;font:400 12px var(--type);color:#5d4a2c;letter-spacing:.06em;padding-top:7px}
.bsec{font:400 12px var(--type);letter-spacing:.2em;color:#7a2a1a;margin:22px 0 8px;display:flex;align-items:center;gap:10px}.bsec::after{content:'';flex:1;border-top:1px solid #9c8a64}
.bl{font:400 15px/1.75 var(--serif);color:#3a2c1c;margin:12px 0 0}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bsp{border-left:3px solid #8b744c;padding:4px 0 4px 10px}.bsp b{display:block;font:700 14.5px var(--serif)}.bsp small{display:block;font:400 13px/1.5 var(--serif);color:#4a3a26}.bsp.d{border-left-color:var(--ox2)}
.bdec{display:flex;gap:10px;align-items:baseline;font:400 14px var(--serif);padding:4px 0;border-bottom:1px dotted #c9b78f}.bdec span{font:400 12px var(--type);color:#7a2a1a;min-width:74px}
.uts{display:flex;flex-wrap:wrap;gap:8px}.uts span{display:inline-flex;align-items:center;gap:7px;font:600 13.5px var(--serif);padding:5px 10px 5px 6px;border:1px solid #7a6440;background:#f8f0dc}
.uts svg{flex:none}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid #2a1f14;margin-top:16px}.sg div{padding:8px 12px;border-right:1px solid #9c8a64}.sg div:last-child{border-right:0}.sg small{display:block;font:400 11.5px var(--type);color:#5d4a2c}.sg b{font:400 24px var(--type)}
.pl{display:flex;flex-wrap:wrap;gap:6px}.pl span{font:600 13px var(--serif);padding:5px 10px;border:1px solid #7a6440;display:flex;gap:7px;align-items:center;background:#f8f0dc}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;align-items:center}

.stamp{position:absolute;top:70px;right:34px;font:900 18px var(--serif);letter-spacing:.24em;color:var(--ox2);border:3px solid var(--ox2);padding:6px 14px;transform:rotate(9deg);opacity:.7;pointer-events:none}
@media (max-width:900px){.scn{grid-template-columns:1fr}.sc{min-height:0}.mfrm{grid-template-columns:1fr}.lob{grid-template-columns:1fr}.lob-l{max-height:44vh}.sg{grid-template-columns:repeat(2,1fr)}.brief-top{grid-template-columns:auto 1fr}.brief-top .photo{grid-column:1/-1}.bgrid{grid-template-columns:1fr}.scr-h{padding:10px 14px}.scr-h .logo{font-size:20px}.mw{padding:20px 14px 30px}.ttl-box{padding:28px 20px}.brief{padding:20px 16px}}
.fl svg,.flg{display:block;flex:none;border:1px solid #0009}.bar .flg,.plate .flg{outline:1px solid #ffffff38}
/* ── 플레이 화면 ── */
.play{position:fixed;inset:0;display:grid;grid-template-rows:52px 1fr;grid-template-columns:68px 1fr}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 10px 0 8px;background:var(--ink);border-bottom:1px solid #000;z-index:5;min-width:0}
.bar .me{display:flex;align-items:center;gap:9px;min-width:0}.bar .me b{font:700 17px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rs small{font:500 11px var(--sans);color:var(--mu)}.rs b{font:700 16px var(--sans);font-variant-numeric:tabular-nums}.rs.sub b{font-size:13px;color:#c8cdd0}
.dl{font:700 11px var(--sans);font-variant-numeric:tabular-nums;animation:dl 7s forwards}.dl.n{color:var(--bad)}.dl.p{color:var(--ok)}@keyframes dl{0%,80%{opacity:1}100%{opacity:0}}

#rdy{height:34px;min-width:118px;font-size:13px}#rdy.wait{background:#24303a;border-color:#3d4a56;color:#b9c0c4}

.tabs .sp{flex:1}.tb.sm{height:34px;font-size:11px}
.mapw{position:relative;overflow:hidden;background:var(--sea)}
#cv{position:absolute;inset:0;display:block}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}#map:active{cursor:grabbing}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.55}
/* 지도 요소 */
.sea{fill:var(--sea)}
#grat path{stroke:#7f969d;stroke-width:.6;fill:none;vector-effect:non-scaling-stroke;opacity:.55}
.h1,.h2{fill:none;stroke-linejoin:round;vector-effect:non-scaling-stroke}.h1{stroke:#8ea4ab;stroke-width:5}
.c>path{stroke:#6e3f35;stroke-opacity:.7;stroke-width:.9;stroke-dasharray:4 1.6 1 1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer}
.c:hover>path:first-child{filter:brightness(1.05) saturate(1.1)}
.c.fl>path:first-child{animation:fl 1.2s ease-in-out 4}@keyframes fl{50%{filter:brightness(.82) saturate(1.6)}}
.ci{fill:none;stroke:#5c4a33;stroke-opacity:.28;stroke-width:7;vector-effect:non-scaling-stroke}.co{fill:none;stroke:#3f4b4f;stroke-width:.9;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#copies{pointer-events:none}#map.wv #terr,#map.wv #usl{display:none}
#map.mv .h1,#map.mv .h2,#map.mv .ci,#map.mv #grat,#map.mv .mt,#map.mv .usl,#map.mv .lake,#map.mv .riv,#map.mv #copies{display:none}#map.mv .c>path{stroke-dasharray:none}.mapw.mv .grain{display:none}
.mt{stroke:#6d5639;stroke-width:.9;fill:none;vector-effect:non-scaling-stroke;opacity:.75}
.lake{fill:#a7b9be;stroke:#3f4b4f;stroke-width:.7;vector-effect:non-scaling-stroke}

.zm button{background:#2a1c12 var(--noise);color:#f1e6c8;border:1px solid #6b5636;border-radius:0}
.sheet{background:var(--parch) var(--noise);color:#2a1f14;border:1px solid #6b5636;box-shadow:inset 0 0 60px rgba(122,88,38,.25),3px 4px 0 rgba(0,0,0,.35)}
.sh{background:#2a1c12 var(--noise);color:#f1e6c8;border-bottom:2px solid #6b5636}.sh b{font-family:var(--serif)}.sh small{color:#cbbd98}.sh button{border-color:#6b5636;color:#f1e6c8}
.sb{color:#2a1f14}.sb .kv,.db .kv{background:#9c8a64;border-color:#9c8a64}.sb .kv div,.db .kv div{background:#f3e9d0}.sb .kv small,.db .kv small{color:#6d5a3a;font-family:var(--serif)}.sb .kv b,.db .kv b{color:#2a1f14;font:400 19px var(--type)}
.sb .sec,.db .sec{color:#7a2a1a;border-bottom:1px solid #c9b78f;font-family:var(--serif);letter-spacing:.14em}
.sb .ln{border-bottom-color:#d6c6a0}.sb .ln small{color:#6d5a3a}.sb .ln .v{color:#2a1f14;font-family:var(--type);font-weight:400}.sb .ln.cl:hover{background:#00000008}.sb .ln.hot{background:#a3361b1c}
.sb button,.db button{background:#f3e9d0;color:#2a1f14;border:1px solid #7a6440;border-radius:0;font-family:var(--serif)}.sb button:hover,.db button:hover{background:#fff8e8}
.sb button.pri,.db button.pri{background:var(--ox);color:#f6ead0;border-color:#3c0f08}.sb button.on,.db button.on{background:#2a1f14;color:#f1e6c8;border-color:#2a1f14;outline:0}
.sb .opt{background:#fbf5e4;color:var(--pink);border-color:#c9bc9c}.sb .opt:hover:not(:disabled){background:#fff;border-color:#8c7d5e}.sb .opt .rd{border-color:#8c7d5e}.sb .opt.on{color:var(--pink);background:#fff;border-color:#a3361b;box-shadow:inset 3px 0 0 #a3361b}.sb .opt.on .rd{border-color:#a3361b;background:radial-gradient(circle,#a3361b 0 4px,transparent 5px)}
.sb .fx{background:#00000008;color:#4a4030;border-color:#00000014}.sb .fx.up{color:#2f6b25;background:#4f7a4514;border-color:#4f7a4540}.sb .fx.dn{color:#9a2f18;background:#a3361b12;border-color:#a3361b40}
.opt b,.dec .dt b,.spr b,.uts2 b{font-family:var(--serif)}.opt .q,.spr .q{grid-column:2/-1;font:italic 400 12.5px/1.5 var(--serif);color:#6d5a3a}
.tag{color:#5d4a2c;border-color:#9c8a64;font-family:var(--serif)}.tag.ok{color:#2f6b25;border-color:#4f7a45}.tag.bad{color:#9a2f18;border-color:#a3361b}.tag.acc{color:#a3361b;border-color:#a3361b}
.warn{background:#f3d9c9;color:#6e1f10;border-color:#a3361b;font-family:var(--serif)}.sb .note,.db .note{color:#6d5a3a;font-family:var(--serif)}
.bar2{background:#e3d5b2;border-color:#7a6440}.bar2 i{background:#5d7a52}.bar2 i.u{background:#a8862e}
.sb .docx{background:#00000006}.sb .docx p,.sb .fxl{color:#4a4030}
.doc{background:var(--parch) var(--noise);border:1px solid #6b5636;box-shadow:inset 0 0 60px rgba(122,88,38,.25),3px 4px 0 rgba(0,0,0,.35)}.dh{background:#2a1c12 var(--noise);border-bottom:2px solid #6b5636}.dh b{font-family:var(--serif)}.dh button{color:#f1e6c8;border-color:#6b5636}
.db .ledger td,.db .ledger th{border-bottom-color:#cdbb92}.db .subt button{background:#efe4c8;color:#3a2a1a}.db .subt button.on{background:#2a1c12;color:#f1e6c8}
.agenda{background:var(--parch) var(--noise);color:#2a1f14;border:1px solid #6b5636;border-left:5px solid var(--ox);box-shadow:3px 4px 0 rgba(0,0,0,.35)}.agenda small{color:#8f2a17;font-family:var(--serif)}.agenda b{font-family:var(--serif)}.agenda span{color:#5d4a2c}.agenda .go{color:#8f2a17}
.pop{background:var(--parch) var(--noise);color:#2a1f14;border:1px solid #6b5636}.pop::after{border-top-color:var(--parch)}.pop h5{font-family:var(--serif)}.pop dt,.pop .st{color:#6d5a3a}.pop .st i{color:#a3361b}.pop button{background:#f3e9d0;color:#2a1f14;border:1px solid #7a6440;border-radius:0}.pop button.pri{background:var(--ox);color:#f6ead0;border-color:#3c0f08}
#tags .et{background:#f3e9d0;color:#3a2a1a;border-color:#7a6440;font-family:var(--serif)}#tags .et.hot{background:var(--ox);color:#f6ead0;border-color:var(--ox)}
.ft text{fill:#2a1a0e;stroke:#efe4c8;font-family:var(--serif);font-weight:600}
.paperN{background:var(--parch) var(--noise)}
/* 시작 화면: 양피지 위 출항 장면 */
.scr.pp{background:#e7d6aa var(--noise)}
.scr.pp .scr-veil{background:radial-gradient(ellipse 75% 70% at 50% 45%,transparent 55%,rgba(110,72,30,.45) 85%,rgba(70,40,14,.8))}
.sea-scene{position:absolute;inset:0;width:100%;height:100%}
.sea-scene .ink{fill:none;stroke:#3b2a1a;stroke-linecap:round;stroke-linejoin:round}
.ship{animation:sail var(--d,70s) linear infinite;animation-delay:var(--dl,0s)}
.ship .bob{animation:bob 3.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 80%}
.smk circle{fill:#5a4630;opacity:0;animation:smoke 4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes sail{from{transform:translate(0,0)}to{transform:translate(var(--tx,1500px),var(--ty,60px))}}
@keyframes bob{from{transform:rotate(-1.4deg) translateY(0)}to{transform:rotate(1.4deg) translateY(3px)}}
@keyframes smoke{0%{opacity:.5;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-40px,-46px) scale(2.2)}}
.scr.pp .ttl-box{background:rgba(239,227,196,.82);border-color:#6b5636}.scr.pp .orn>.cn path{stroke:#6b5636}.scr.pp .logo{color:#2a1a0e;text-shadow:none}.scr.pp .logo i{color:#8f2a17}.scr.pp .ttl-k{color:#6b5636}.scr.pp .ttl-ko{color:#3b2a1a}.scr.pp .ttl-foot{color:#6b5636}
.scr.pp .mb:not(.pri){background:#f6ecd2 var(--noise)}

body{background:#d9c49a}
#splash{background:#e3d0a6;color:var(--ink)}#splash .sp-map,#splash .sp-vig,#splash .sp-in{display:none}
.spx{position:absolute;left:50%;top:50%;width:max(100vw,calc(100vh*1.7768));aspect-ratio:1672/941;transform:translate(-50%,-50%)}
.sp-pb{position:absolute;left:13.2%;top:88.9%;width:34%;height:1.1%;background:#efe1c2;border:1px solid #3b2a1a}.sp-pb i{position:absolute;inset:0 auto 0 0;width:8%;background:var(--navy);transition:width .5s}
.sp-lb{position:absolute;left:13.2%;top:91.2%;width:34%;display:flex;justify-content:space-between;font:500 clamp(10px,.8vw,14px) var(--serif);color:#4a3822}
#splash .sp-q2{position:absolute;left:13.2%;top:94.2%;width:34%;font:italic 400 clamp(11px,.85vw,15px) 'IM Fell English',var(--serif);color:#3b2a1a}#splash .sp-q2 b{font-style:normal;color:var(--ox);margin-right:8px}
.sp-patch{position:absolute;left:9%;top:78%;width:42%;height:18%;background:#ecdcbb var(--noise);-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%)}
.tt{background:#e3d0a6}.tt-menu{position:absolute;left:13.2%;top:81.5%;width:34%;display:grid;grid-template-columns:1fr 1fr;gap:4%}
.tt-menu .mb{height:clamp(40px,3.4vw,58px);font:700 clamp(13px,1.05vw,18px) var(--serif)}
.tt-au{position:absolute;right:18px;top:16px;z-index:3}.tt .warn{grid-column:1/-1}
.smoke{position:absolute;left:68.4%;top:72%;width:4%;height:6%;pointer-events:none}.smoke i{position:absolute;left:30%;bottom:0;width:40%;aspect-ratio:1;border-radius:50%;background:rgba(70,58,44,.45);filter:blur(3px);animation:smk2 6s linear infinite}.smoke i:nth-child(2){animation-delay:2s}.smoke i:nth-child(3){animation-delay:4s}
@keyframes smk2{0%{transform:translate(0,0) scale(.6);opacity:.8}100%{transform:translate(-160%,-260%) scale(2.6);opacity:0}}
.aub{display:inline-flex;gap:4px}.aub button{width:32px;height:30px;padding:0;font-size:14px;background:transparent;border:1px solid var(--ink2);color:var(--ink);border-radius:2px}.aub button.off{opacity:.35;text-decoration:line-through}
/* 메뉴·로비 */
.scr{background:#e3d0a6;color:var(--ink)}.scr .scr-bg{animation:none;inset:0}.scr .scr-bg .sp-img{opacity:.55;filter:sepia(.2)}.scr-veil.dk{background:rgba(236,220,185,.72)}
.scr-h{background:rgba(236,222,190,.94) var(--noise);border-bottom:3px double var(--ink);color:var(--ink)}.scr-h .logo{color:var(--ink);font-family:'Cinzel',serif;font-weight:700;letter-spacing:.08em}.scr-h .logo i{color:var(--ox)}.scr-h button{color:var(--ink);border-color:var(--ink2)}.scr-h .rc{color:var(--ink2)}.scr-h .rc b{color:var(--ink)}
.scr .mt{color:var(--ink)}.scr .ms{color:var(--ink2)}.scr .lab2{color:var(--ox)}.scr .lab2::after{border-top-color:var(--ink2)}.scr .mw>.note2{color:var(--ink2)}
.ppr{border:14px solid transparent;border-image:var(--frame) 24 / 14px stretch;background:var(--pp2) var(--noise);background-clip:padding-box;box-shadow:0 10px 24px rgba(60,38,14,.28)}
.sc{border:12px solid transparent;border-image:var(--frame) 24 / 12px stretch}.sc.on{outline:3px solid var(--navy);outline-offset:2px}
.big.pri,.ppr button.pri,.mb.pri{background:var(--navy) var(--noise);border-color:#0f1630;color:#f4e8cd;box-shadow:inset 0 0 0 3px var(--navy),inset 0 0 0 4px #b9a87e}
.mb:not(.pri){background:var(--pp2) var(--noise);color:var(--ink)}
/* 게임 화면 */
.bar{background:var(--pp) var(--noise);border-bottom:3px double var(--ink);box-shadow:0 3px 8px rgba(60,38,14,.25);color:var(--ink)}
.bar .me b{color:var(--ink);font:700 19px var(--serif)}.rs{border-left:1px solid #b9a27a}.rs small{color:var(--ink2);font:600 12px var(--serif)}.rs b{color:var(--ink);font:700 19px 'Cinzel',serif}.rs.sub b{color:var(--ink2);font-size:15px}
.date b{color:var(--ink);font:700 16px var(--serif)}.date small{color:var(--ink2)}
#rdy{background:var(--navy) var(--noise);border:1px solid #0f1630;color:#f4e8cd;box-shadow:inset 0 0 0 2px var(--navy),inset 0 0 0 3px #b9a87e;font:700 14px var(--serif)}#rdy.wait{background:var(--pp3);color:var(--ink2);border-color:var(--ink2);box-shadow:none}
.warchip{font:700 13px var(--serif);color:#f6e3cc;background:var(--ox);padding:6px 10px;border-radius:2px;cursor:pointer;white-space:nowrap;box-shadow:inset 0 0 0 2px var(--ox),inset 0 0 0 3px #e7b49c;animation:wpulse 2s ease-in-out infinite}@keyframes wpulse{50%{filter:brightness(1.18)}}

function spiritsOf(s,n){const id=NID(n),N=s.N[n];if(!N)return[];const X=(s.SPX||{})[n]||{},tg=tagsOf(n),ownD=SPS.some(p=>p.n==id&&p.doc),ownS=SPS.some(p=>p.n==id&&!p.doc&&!p.add),ak=archKey(n);

function decOK(s,n,d){const N=s.N[n],y=yr(s);if(DTAKEN(s,n,d.id))return{ok:0,why:'이미 결정함'};if(y<d.y0)return{ok:0,why:d.y0+'년부터'};if(y>d.y1)return{ok:0,why:'시기가 지남'};if(d.req&&!d.req(s,n))return{ok:0,why:d.rq||'조건 미충족'};if(N.g<(d.cost||0))return{ok:0,why:'국고 부족'};return{ok:1}}

  spiritsOf(s,n).forEach(p=>{if(p.tick)p.tick(s,n,N,y,oo[n])});N.sup=Math.max(0,Math.min(100,N.sup));N.g=Math.max(0,N.g);N.mil=Math.max(0,N.mil);N.ind=Math.max(1,N.ind);for(const k in N.st)N.st[k]=Math.max(0,N.st[k])})}

function ultCond(s,n,c,rid){if(!c)return true;const t=terrOf(rid);if(c=='home')return s.R[rid]&&s.R[rid].o==n;if(c=='rough')return t=='mtn'||t=='hill';if(c=='desert')return t=='desert';if(c=='cold'){const T=T2[rid],lat=T?80-T.cy*138/560:40;return t=='forest'||t=='tundra'||(WIN(s)&&lat>45)}if(c=='urbhome')return t=='urban'||(s.R[rid]&&s.R[rid].o==n);return true}

function ultUnder(s,n){const N=s.N[n],W=wars(s,n).filter(x=>s.N[x]),pool=W.length?W:nb(s,n).filter(x=>s.N[x]);const em=Math.max(0,...pool.map(x=>s.N[x].mil));let u=clamp(em/Math.max(1,N.mil),1,3);if(Object.values(s.R).some(R=>R.o==n&&R.occ))u=Math.min(3,u+.3);return+u.toFixed(2)}
function ultFire(s,n){const N=s.N[n];if(!N||(s.ULT||{})[n])return;s.ULT=s.ULT||{};const u=ultUnder(s,n),k=ultK(u),D=ultOf(n),f=D[3],y=yr(s),en=wars(s,n).filter(x=>s.N[x]),out=[];s.ULT[n]={t:s.t,u};

 if(f.fr)for(const r in s.FR||{}){const F=s.FR[r];if(F.d==n){F.p-=Math.round(f.fr*k);if(F.p<=0)delete s.FR[r]}}
 if(f.rec){const L=Object.keys(s.R).filter(r=>s.R[r].o==n&&s.R[r].occ).sort((a,b)=>held(s,n).some(h=>dist(h,b)<=1)-held(s,n).some(h=>dist(h,a)<=1)).slice(0,Math.round(f.rec*k));L.forEach(r=>{const oc=s.R[r].occ;s.R[r].occ=null;if(s.FR)delete s.FR[r];if(s.N[oc])s.N[oc].sup-=2});if(L.length)out.push(L.map(r=>RG[r][0]).join('·')+' 탈환')}

function supD(s,n){const D={},q=[];const cap=HOMEK2(s,n);if(cap&&friend(s,n,ctrl(s,cap))){D[cap]=0;q.push(cap)}

function hops(s,n,from,to,lim){if(!from||!to)return 99;if(from==to)return 0;const D={[from]:0},q=[from];for(let i=0;i<q.length;i++){const r=q[i],d=D[r];if(d>=(lim||8))break;for(const x of(ADJ&&ADJ[r]||[])){if(D[x]!=null)continue;if(x==to)return d+1;if(ctrl(s,x)!=n)continue;D[x]=d+1;q.push(x)}}return 99}
function pathTo(s,n,from,to){const P={[from]:null},q=[from];for(let i=0;i<q.length;i++){const r=q[i];if(r==to)break;for(const x of(ADJ&&ADJ[r]||[])){if(x in P)continue;if(ctrl(s,x)!=n&&x!=to)continue;P[x]=r;q.push(x)}}if(!(to in P))return null;const out=[];let c=to;while(c){out.unshift(c);c=P[c]}return out}

function auInit(){if(AU.c)return;try{const C=new(window.AudioContext||window.webkitAudioContext)();AU.c=C;AU.m=C.createGain();AU.m.gain.value=.8;AU.m.connect(C.destination);
 AU.rv=C.createConvolver();const L=C.sampleRate*2.8,b=C.createBuffer(2,L,C.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.6)}AU.rv.buffer=b;const rg=C.createGain();rg.gain.value=.5;AU.rv.connect(rg);rg.connect(AU.m);
 AU.mus=C.createGain();AU.mus.gain.value=AU.on?.22:0;AU.mus.connect(AU.m);AU.mus.connect(AU.rv);AU.sfx=C.createGain();AU.sfx.gain.value=AU.sfxOn?.5:0;AU.sfx.connect(AU.m);

// 곡: 라 단조 행진풍 — Am F C G / Dm Am E Am, 느린 현악 화음 위에 피아노풍 선율
const HZ=m=>440*Math.pow(2,(m-69)/12);
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62],[50,53,57],[57,60,64],[52,56,59],[57,60,64]];
const MEL=[[76,74,72,71],[72,69,67,69],[67,64,67,72],[71,74,71,67],[69,65,69,72],[72,71,69,64],[68,71,74,71],[69,72,76,0]];
function pad(t,notes,d){const C=AU.c;notes.forEach((m,i)=>{[0,7].forEach(det=>{const o=C.createOscillator(),g=C.createGain(),f=C.createBiquadFilter();o.type='sawtooth';o.frequency.value=HZ(m-12+(i==0?-0:0));o.detune.value=det-3;f.type='lowpass';f.frequency.value=700;f.Q.value=.4;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+1.4);g.gain.setValueAtTime(.045,t+d-1.2);g.gain.linearRampToValueAtTime(0,t+d+.6);o.connect(f);f.connect(g);g.connect(AU.mus);o.start(t);o.stop(t+d+.7)})});
 const b=C.createOscillator(),bg=C.createGain();b.type='triangle';b.frequency.value=HZ(notes[0]-24);bg.gain.setValueAtTime(0,t);bg.gain.linearRampToValueAtTime(.12,t+.3);bg.gain.exponentialRampToValueAtTime(.001,t+d);b.connect(bg);bg.connect(AU.mus);b.start(t);b.stop(t+d+.1)}
function pluck(t,m,v=.1){if(!m)return;const C=AU.c,o=C.createOscillator(),o2=C.createOscillator(),g=C.createGain();o.type='triangle';o2.type='sine';o.frequency.value=HZ(m);o2.frequency.value=HZ(m)*2.01;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+1.6);o.connect(g);o2.connect(g);g.connect(AU.mus);o.start(t);o2.start(t);o.stop(t+1.7);o2.stop(t+1.7)}
function snare(t,v=.05){const C=AU.c,L=C.sampleRate*.12,b=C.createBuffer(1,L,C.sampleRate),d=b.getChannelData(0);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*(1-i/L);const s=C.createBufferSource(),f=C.createBiquadFilter(),g=C.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=1800;g.gain.value=v;s.connect(f);f.connect(g);g.connect(AU.mus);s.start(t)}
function auSched(){if(!AU.c||!AU.on)return;const C=AU.c,beat=1.15,barD=beat*4;while(AU.next<C.currentTime+1.2){const t=AU.next,i=AU.bar%8;pad(t,PROG[i],barD);const mel=MEL[i],play=(AU.bar>>3)%2==1;
  for(let k=0;k<4;k++){if(play||k%2==0)pluck(t+k*beat,mel[k],play?.09:.05);if(k==3)snare(t+k*beat+beat*.5,.025);snare(t+k*beat,.018)}AU.next+=barD;AU.bar++}}
function sfx(k){if(!AU.c||!AU.sfxOn)return;const C=AU.c,t=C.currentTime,noise=(dur,f1,f2,v,type='bandpass')=>{const L=Math.max(1,C.sampleRate*dur|0),b=C.createBuffer(1,L,C.sampleRate),d=b.getChannelData(0);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,1.5);const s=C.createBufferSource(),f=C.createBiquadFilter(),g=C.createGain();s.buffer=b;f.type=type;f.frequency.setValueAtTime(f1,t);f.frequency.linearRampToValueAtTime(f2,t+dur);g.gain.value=v;s.connect(f);f.connect(g);g.connect(AU.sfx);s.start(t)},
 tone=(fq,dur,v,type='sine',f2)=>{const o=C.createOscillator(),g=C.createGain();o.type=type;o.frequency.setValueAtTime(fq,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AU.sfx);o.start(t);o.stop(t+dur+.05)};
 if(k=='click')noise(.04,2600,1800,.35);else if(k=='page')noise(.35,600,2400,.4);else if(k=='stamp'){tone(110,.25,.9,'sine',50);noise(.08,900,300,.8,'lowpass')}
 else if(k=='bell'){tone(880,1.6,.25);tone(1320,1.2,.12);tone(660,2,.12)}else if(k=='boom'){noise(1.2,400,60,1.1,'lowpass');tone(55,1,.8,'sine',30)}else if(k=='paper'){noise(.5,1200,3000,.35);setTimeout(()=>sfx('click'),180)}
