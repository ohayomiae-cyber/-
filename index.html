<style>
:root{--ink:#151d26;--ink2:#1c2630;--ink3:#27333e;--ln:#3a4855;--tx:#e7e2d4;--mu:#97a1a7;--acc:#c4532d;--acc2:#e07a4f;--ok:#7fa36f;--bad:#e0745a;--paper:#ece2c8;--paper2:#f2ebd8;--pink:#211c16;--sea:#a7b9be;--serif:'Noto Serif KR','Nanum Myeongjo',serif;--sans:'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;color-scheme:dark}

:root[data-theme=dark]{--ink:#151d26;--tx:#e7e2d4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--tx);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button{font:600 13px/1 var(--sans);color:var(--tx);background:var(--ink3);border:1px solid #475563;border-radius:2px;padding:0 12px;height:34px;cursor:pointer;touch-action:manipulation}

button.pri{background:var(--acc);border-color:var(--acc2);color:#fff}button.on{background:#e9e3d2;color:#151b22;border-color:#fff}
input,select{font:500 13px var(--sans);color:var(--tx);background:var(--ink3);border:1px solid #475563;border-radius:2px;height:32px;padding:0 8px}
.num{font-variant-numeric:tabular-nums}
/* ── 로딩·타이틀·메뉴 (고풍 지도책) ── */
:root{--parch:#ecdfbf;--parch2:#e2d2ab;--sepia:#2a1f14;--brass:#b39a68;--ox:#7d2417;--ox2:#a3361b;--type:'Special Elite','Courier New',monospace;--noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .12 0 0 0 .55 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}
.logo{font-family:'IM Fell English SC','IM Fell English',Georgia,serif;font-weight:400;color:#f1e6c8;letter-spacing:.02em;line-height:.95;margin:0}

.orn>.cn{position:absolute;width:34px;height:34px;pointer-events:none}.orn>.cn path{fill:none;stroke:var(--brass);stroke-width:1.3}
.orn>.c1{left:-12px;top:-12px}.orn>.c2{right:-12px;top:-12px;transform:scaleX(-1)}.orn>.c3{left:-12px;bottom:-12px;transform:scaleY(-1)}.orn>.c4{right:-12px;bottom:-12px;transform:scale(-1)}
#splash{position:fixed;inset:0;z-index:100;background:#1b140d var(--noise);display:grid;place-items:center;color:#f1e6c8;transition:opacity .7s ease,visibility .7s;overflow:hidden}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-map{position:absolute;inset:-3%;opacity:0;transition:opacity 1.6s ease;filter:sepia(.6) brightness(.55) contrast(1.05)}#splash .sp-map.on{opacity:.55}#splash .sp-map img{width:100%;height:100%;object-fit:cover}
#splash .sp-vig{position:absolute;inset:0;background:radial-gradient(ellipse 70% 62% at 50% 48%,transparent,rgba(16,11,6,.92) 78%)}
.sp-in{position:relative;text-align:center;width:min(640px,88vw)}

.sp-sub{font:600 14px var(--serif);letter-spacing:.34em;color:#d8cba8}
.sp-scale{margin:30px auto 0;width:min(460px,80vw)}
.sp-cells{display:grid;grid-template-columns:repeat(10,1fr);height:9px;border:1px solid #d8cba8}.sp-cells i{border-right:1px solid #d8cba8;transition:background .35s}.sp-cells i:last-child{border-right:0}.sp-cells i.f:nth-child(odd){background:#f1e6c8}.sp-cells i.f:nth-child(even){background:#3a2c1d}
.sp-lbl{display:flex;justify-content:space-between;font:400 11px var(--type);color:#bfb18d;margin-top:5px;letter-spacing:.06em}

.sp-q{margin-top:26px;font:italic 400 15px 'IM Fell English',var(--serif);color:#e9dcb9;min-height:22px;transition:opacity .4s}.sp-q b{font:600 13px var(--serif);font-style:normal;color:var(--brass);margin-right:8px}
.scr{position:fixed;inset:0;overflow:hidden;background:#1b140d;color:var(--tx)}

.scr-bg img,.scr-bg svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scr-bg img{filter:sepia(.45) brightness(.82)}

.scr-c{position:relative;height:100%;overflow:auto}

.ttl-foot{position:absolute;bottom:22px;left:0;right:0;font:400 12px var(--type);color:#a99a76;letter-spacing:.14em}

.scr-h .logo{font-size:26px;flex:1}.scr-h button{height:36px;font:600 13px var(--serif);background:transparent;border-color:#6b5636;color:#e9dcb9}
.scr-h .rc{display:flex;align-items:center;gap:10px;font:500 13px var(--serif);color:#bfb18d}.scr-h .rc b{font:400 22px var(--type);letter-spacing:.12em;color:#f1e6c8}
.mw{max-width:1200px;margin:0 auto;padding:30px 24px 44px}
.mt{font:700 32px var(--serif);margin:0 0 4px;color:#f1e6c8}.ms{color:#cbbd98;font:400 15px var(--serif);margin:0 0 24px}
.lab2{font:400 13px var(--type);letter-spacing:.24em;color:var(--brass);margin:28px 0 12px;display:flex;align-items:center;gap:12px}.lab2::after{content:'';flex:1;border-top:1px solid #5d4a2c}
.scn{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.sc{height:auto;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:22px 22px 18px;border-radius:0;min-height:270px;position:relative;transition:transform .15s}

.sc h3{font:900 21px var(--serif);margin:10px 0 8px;color:#2a1f14}.sc p{font:400 14px/1.7 var(--serif);color:#4a3a26;margin:0 0 14px;flex:1}
.sc .fls{display:flex;gap:5px;flex-wrap:wrap}.sc .tn{font:400 12.5px var(--type);color:#5d4a2c;margin-top:12px}
.sc .stp{position:absolute;right:16px;bottom:18px;font:900 15px var(--serif);color:var(--ox2);border:2.5px solid var(--ox2);padding:4px 10px;transform:rotate(-8deg);opacity:0;letter-spacing:.2em}.sc.on .stp{opacity:.85}
.mfrm{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;padding:20px 22px;margin-top:18px}
.fld label{display:block;font:400 12.5px var(--type);color:#5d4a2c;margin-bottom:8px;letter-spacing:.12em}
.fld .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fld input{height:46px;font:400 22px var(--type);letter-spacing:.16em;text-transform:uppercase;width:210px;background:#f8f0dc;color:#2a1f14;border:1px solid #7a6440;border-radius:0}
.chip{height:42px;padding:0 15px;font:600 14px var(--serif);background:transparent;color:#2a1f14;border:1px solid #7a6440;border-radius:0}.chip:hover{background:#f8f0dc}.chip.on{background:#2a1f14;color:var(--parch);border-color:#2a1f14}
.big{height:54px;padding:0 32px;font:700 16px var(--serif);letter-spacing:.1em;border-radius:0}
.big.pri,.ppr button.pri{background:var(--ox);border-color:#3c0f08;color:#f6ead0;box-shadow:inset 0 0 0 3px var(--ox),inset 0 0 0 4px #d9a27c}
.big:disabled{opacity:.45}
.note2{color:#5d4a2c;font:400 14px/1.6 var(--serif);margin-top:14px}.scr .mw>.note2{color:#bfb18d}
.lob{display:grid;grid-template-columns:minmax(300px,370px) 1fr;gap:22px;align-items:start}
.lob-l{max-height:calc(100vh - 170px);display:flex;flex-direction:column}

.lob-ls{overflow:auto;padding:0 8px 12px}
.seg{font:400 12px var(--type);letter-spacing:.2em;color:#7a2a1a;padding:16px 8px 6px;border-bottom:1.5px solid #2a1f14;margin-bottom:2px}
.nt{width:100%;height:auto;display:flex;align-items:center;gap:12px;text-align:left;padding:9px 8px;background:transparent;border:0;border-bottom:1px solid #c9b78f;border-radius:0;color:#2a1f14}
.nt:hover{background:#00000008}.nt.on{background:#2a1f14;color:var(--parch)}.nt.on small{color:#cbbd98}
.nt b{display:block;font:700 15px var(--serif)}.nt small{display:block;font:400 12.5px var(--serif);color:#5d4a2c;margin-top:2px}.nt>span{flex:1;min-width:0}

.brief-hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double #2a1f14;padding-bottom:8px;font:400 12px var(--type);letter-spacing:.14em;color:#5d4a2c}.brief-hd b{font:400 14px var(--type);color:#7a2a1a;letter-spacing:.3em}
.brief-top{display:grid;grid-template-columns:auto 1fr 280px;gap:20px;align-items:start;margin-top:18px}

.brief h2{font:900 34px/1.15 var(--serif);margin:0;color:#2a1f14}
.brief .gv{font:400 14px var(--serif);color:#5d4a2c;margin-top:4px}
.photo{border:1px solid #2a1f14;background:#a7b9be;padding:0;box-shadow:2px 3px 0 rgba(0,0,0,.25)}.photo img{display:block;width:100%;height:160px;object-fit:cover;filter:sepia(.35)}.photo figcaption{font:400 11px var(--type);color:#5d4a2c;padding:4px 6px;background:var(--parch2)}
.brief table{width:100%;border-collapse:collapse;margin-top:14px;font:400 14px var(--serif)}.brief td{padding:5px 0;border-bottom:1px dotted #9c8a64;vertical-align:top}.brief td:first-child{width:96px;font:400 12px var(--type);color:#5d4a2c;letter-spacing:.06em;padding-top:7px}
.bsec{font:400 12px var(--type);letter-spacing:.2em;color:#7a2a1a;margin:22px 0 8px;display:flex;align-items:center;gap:10px}.bsec::after{content:'';flex:1;border-top:1px solid #9c8a64}
.bl{font:400 15px/1.75 var(--serif);color:#3a2c1c;margin:12px 0 0}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bsp{border-left:3px solid #8b744c;padding:4px 0 4px 10px}.bsp b{display:block;font:700 14.5px var(--serif)}.bsp small{display:block;font:400 13px/1.5 var(--serif);color:#4a3a26}.bsp.d{border-left-color:var(--ox2)}
.bdec{display:flex;gap:10px;align-items:baseline;font:400 14px var(--serif);padding:4px 0;border-bottom:1px dotted #c9b78f}.bdec span{font:400 12px var(--type);color:#7a2a1a;min-width:74px}
.uts{display:flex;flex-wrap:wrap;gap:8px}.uts span{display:inline-flex;align-items:center;gap:7px;font:600 13.5px var(--serif);padding:5px 10px 5px 6px;border:1px solid #7a6440;background:#f8f0dc}
.uts svg{flex:none}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid #2a1f14;margin-top:16px}.sg div{padding:8px 12px;border-right:1px solid #9c8a64}.sg div:last-child{border-right:0}.sg small{display:block;font:400 11.5px var(--type);color:#5d4a2c}.sg b{font:400 24px var(--type)}
.pl{display:flex;flex-wrap:wrap;gap:6px}.pl span{font:600 13px var(--serif);padding:5px 10px;border:1px solid #7a6440;display:flex;gap:7px;align-items:center;background:#f8f0dc}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;align-items:center}

.stamp{position:absolute;top:70px;right:34px;font:900 18px var(--serif);letter-spacing:.24em;color:var(--ox2);border:3px solid var(--ox2);padding:6px 14px;transform:rotate(9deg);opacity:.7;pointer-events:none}
@media (max-width:900px){.scn{grid-template-columns:1fr}.sc{min-height:0}.mfrm{grid-template-columns:1fr}.lob{grid-template-columns:1fr}.lob-l{max-height:44vh}.sg{grid-template-columns:repeat(2,1fr)}.brief-top{grid-template-columns:auto 1fr}.brief-top .photo{grid-column:1/-1}.bgrid{grid-template-columns:1fr}.scr-h{padding:10px 14px}.scr-h .logo{font-size:20px}.mw{padding:20px 14px 30px}.ttl-box{padding:28px 20px}.brief{padding:20px 16px}}
.fl svg,.flg{display:block;flex:none;border:1px solid #0009}.bar .flg,.plate .flg{outline:1px solid #ffffff38}
/* ── 플레이 화면 ── */
.play{position:fixed;inset:0;display:grid;grid-template-rows:52px 1fr;grid-template-columns:68px 1fr}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 10px 0 8px;background:var(--ink);border-bottom:1px solid #000;z-index:5;min-width:0}
.bar .me{display:flex;align-items:center;gap:9px;min-width:0}.bar .me b{font:700 17px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tabs .sp{flex:1}.tb.sm{height:34px;font-size:11px}
.mapw{position:relative;overflow:hidden;background:var(--sea)}
#cv{position:absolute;inset:0;display:block}

.grain{position:absolute;inset:0;pointer-events:none;opacity:.55}
/* 지도 요소 */
.sea{fill:var(--sea)}
#grat path{stroke:#7f969d;stroke-width:.6;fill:none;vector-effect:non-scaling-stroke;opacity:.55}
.h1,.h2{fill:none;stroke-linejoin:round;vector-effect:non-scaling-stroke}.h1{stroke:#8ea4ab;stroke-width:5}
.c>path{stroke:#6e3f35;stroke-opacity:.7;stroke-width:.9;stroke-dasharray:4 1.6 1 1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer}
.c:hover>path:first-child{filter:brightness(1.05) saturate(1.1)}
.c.fl>path:first-child{animation:fl 1.2s ease-in-out 4}@keyframes fl{50%{filter:brightness(.82) saturate(1.6)}}
.ci{fill:none;stroke:#5c4a33;stroke-opacity:.28;stroke-width:7;vector-effect:non-scaling-stroke}.co{fill:none;stroke:#3f4b4f;stroke-width:.9;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#copies{pointer-events:none}#map.wv #terr,#map.wv #usl{display:none}
#map.mv .h1,#map.mv .h2,#map.mv .ci,#map.mv #grat,#map.mv .mt,#map.mv .usl,#map.mv .lake,#map.mv .riv,#map.mv #copies{display:none}#map.mv .c>path{stroke-dasharray:none}.mapw.mv .grain{display:none}
.mt{stroke:#6d5639;stroke-width:.9;fill:none;vector-effect:non-scaling-stroke;opacity:.75}
.lake{fill:#a7b9be;stroke:#3f4b4f;stroke-width:.7;vector-effect:non-scaling-stroke}

function archKey(n){const tg=tagsOf(n);return['colony','mtn','isl','desert','nordic','balkan','latam','africa','asia','plain'].find(x=>tg.includes(x))||'plain'}
function spiritsOf(s,n){const id=NID(n),N=s.N[n];if(!N)return[];const X=(s.SPX||{})[n]||{},tg=tagsOf(n),ownD=SPS.some(p=>p.n==id&&p.doc),ownS=SPS.some(p=>p.n==id&&!p.doc&&!p.add),ak=archKey(n);
 return SPS.filter(p=>{let ok=p.n==id;if(!ok&&p.n[0]=='@'){const t=p.n.slice(1);ok=tg.includes(t)&&(p.add?true:p.doc?(!ownD&&t==ak):(!ownS||t=='colony'||t=='baltic'))}return ok&&(!p.add||(X[p.id]||0)>s.t)&&(!p.on||p.on(s,n,N))})}
function docM(s,me,foe,r,k,c){if(!s.N[me])return 1;return spiritsOf(s,me).reduce((m,p)=>m*(p.m?p.m(s,me,foe,r,k,c):1),1)}
function decsFor(n){const id=NID(n),tg=tagsOf(n),own=DECS.some(d=>d.n==id);return DECS.filter(d=>d.n==id||(d.n[0]=='@'&&tg.includes(d.n.slice(1))&&(!own||['colony','any'].includes(d.n.slice(1)))))}
function decOK(s,n,d){const N=s.N[n],y=yr(s);if(DTAKEN(s,n,d.id))return{ok:0,why:'이미 결정함'};if(y<d.y0)return{ok:0,why:d.y0+'년부터'};if(y>d.y1)return{ok:0,why:'시기가 지남'};if(d.req&&!d.req(s,n))return{ok:0,why:d.rq||'조건 미충족'};if(N.g<(d.cost||0))return{ok:0,why:'국고 부족'};return{ok:1}}
function natStep(s,oo,ns,y,q){s.DC=s.DC||{};s.SPX=s.SPX||{};

 ns.forEach(n=>{const N=s.N[n],pid=PID(n),h=P_h(s,n);if(!N)return;let ids=h?((oo[n]||{}).dec||[]).slice():[];
  if(!h)decsFor(n).forEach(d=>{if(d.hy&&(y>d.hy[0]||(y==d.hy[0]&&q>=d.hy[1]))&&decOK(s,n,d).ok)ids.push(d.id)});
  ids.forEach(id=>{const d=DECS.find(x=>x.id==id);if(!d||!decsFor(n).includes(d)||!decOK(s,n,d).ok)return;N.g-=d.cost||0;(s.DC[n]=s.DC[n]||[]).push(id);if(d.add)(s.SPX[n]=s.SPX[n]||{})[d.add]=d.dur?s.t+d.dur:1e9;if(d.eff)d.eff(s,n,N,y);s.log.push(`${nm(n,y)}: ${d.t}`)});
  spiritsOf(s,n).forEach(p=>{if(p.tick)p.tick(s,n,N,y,oo[n])});N.sup=Math.max(0,Math.min(100,N.sup));N.g=Math.max(0,N.g);N.mil=Math.max(0,N.mil);N.ind=Math.max(1,N.ind);for(const k in N.st)N.st[k]=Math.max(0,N.st[k])})}
