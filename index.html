const yr=s=>s.Y0+Math.floor(s.t/4),qt=s=>s.t%4+1,dist=(a,b)=>ADJ?(ADJ[a]&&ADJ[a].has(b)?1:9):Math.max(Math.abs(RG[a][1]-RG[b][1]),Math.abs(RG[a][2]-RG[b][2]));

function newGame(mode,secs){const e=mode=='w2',Y0=e?1936:1910,T=mode=='w1'?36:mode=='w2'?40:144,S={mode,Y0,T,t:0,secs,phase:'lobby',N:{},R:{},TR:[],W:[],log:[],P:{},host:uid,ready:{}};

 own.forEach(n=>{const p=P[n]||2;S.N[n]={g:p*30,pop:p*10+20,ind:p*8+10,sup:60,mil:p*6,mil0:p*6,st:{f:20,s:20,o:20},lord:L[n]||null,ind2:0,start:held(S,n).length}});

function attack(s,a,rid,c,why){const R=s.R[rid],d=R.occ||R.o;if(d==a||!alive(s,a)||!held(s,a).some(x=>dist(x,rid)<=1))return;

 if(!atWar(s,a,d)){s.W.push(a+'|'+d);s.log.push(`${nm(a,yr(s))}→${nm(d,yr(s))} 선전포고`+(why?` (${why})`:''));
  s.TR.filter(t=>t.st=='on'&&t.ty=='ally').forEach(t=>{for(const[x,y]of[[t.a,t.b],[t.b,t.a]])if(!P_h(s,y)&&alive(s,y)&&y!=d&&!atWar(s,y,d)&&(x==a)){s.W.push(y+'|'+d);s.log.push(`동맹에 따라 ${nm(y,yr(s))}도 ${nm(d,yr(s))}에 참전`)}
   for(const[x,y]of[[t.a,t.b],[t.b,t.a]])if(x==d&&!P_h(s,y)&&alive(s,y)&&y!=a&&!atWar(s,y,a)){s.W.push(y+'|'+a);s.log.push(`동맹에 따라 ${nm(y,yr(s))}도 ${nm(a,yr(s))}에 참전`)}})}
 const A=s.N[a],D=s.N[d],use=A.mil*c/100,att=use*(.8+Math.random()*.4),def=(D.mil*.5*1.2*(.8+Math.random()*.4)+D.ind*.1)*(D.pol&&D.pol.mil=='garrison'?1.3:1);

const P_h=(s,n)=>Object.values(s.P).includes(n);
function peace(s,t){const{a,b}=t;s.W=s.W.filter(w=>w!=a+'|'+b&&w!=b+'|'+a);

function ai(s,n){const N=s.N[n],o={focus:'ind',atk:[],props:[]},w=wars(s,n),sh=Object.values(N.st).some(v=>v<3);

 T.forEach(t=>{if(/Ivoire/.test(t.n)){m10[t.k]='FRA';m36[t.k]='FRA'}});

 for(let i=0;i<T.length;i++)for(let j=i+1;j<T.length;j++)if(Math.hypot(T[i].cx-T[j].cx,T[i].cy-T[j].cy)<40){A[T[i].k].add(T[j].k);A[T[j].k].add(T[i].k)}
 T.forEach(t=>delete t.keys);RG=R2;ADJ=A;CT=T}catch(e){CT=null;ADJ=null;window.WORLD=null}return CT}
