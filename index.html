<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>세계대전 국가경영</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#151d26;--ink2:#1c2630;--ink3:#27333e;--ln:#3a4855;--tx:#e7e2d4;--mu:#97a1a7;--acc:#c4532d;--acc2:#e07a4f;--ok:#7fa36f;--bad:#e0745a;--paper:#ece2c8;--paper2:#f2ebd8;--pink:#211c16;--sea:#a7b9be;--serif:'Noto Serif KR','Nanum Myeongjo',serif;--sans:'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#151d26;--tx:#e7e2d4;--paper:#ece2c8;color-scheme:dark}}
:root[data-theme=dark]{--ink:#151d26;--tx:#e7e2d4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--tx);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button{font:600 12px/1 var(--sans);color:var(--tx);background:var(--ink3);border:1px solid #475563;border-radius:2px;padding:0 10px;height:30px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:#6a7884}button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc2);color:#fff}button.on{background:#e9e3d2;color:#151b22;border-color:#fff}
input,select{font:500 13px var(--sans);color:var(--tx);background:var(--ink3);border:1px solid #475563;border-radius:2px;height:32px;padding:0 8px}
.num{font-variant-numeric:tabular-nums}
/* ── 메뉴·로비 ── */
.page{position:fixed;inset:0;overflow:auto;background:var(--sea)}
.page .bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.pbox{position:relative;max-width:520px;margin:6vh auto;background:var(--ink);border:1px solid #000;padding:22px 22px 18px}
.pbox h1{font:700 26px/1.2 var(--sans);letter-spacing:.04em;margin:0 0 2px}.pbox .k{color:var(--mu);font-size:12px;margin-bottom:16px}
.pbox .lab{font:600 11px var(--sans);letter-spacing:.12em;color:var(--mu);margin:16px 0 6px}
.eras{display:grid;gap:4px}.era{height:auto;display:grid;grid-template-columns:96px 1fr;text-align:left;padding:9px 10px;gap:2px 10px;background:var(--ink2)}.era b{font:700 17px var(--sans);grid-row:span 2}.era i{font-style:normal;font-size:11px;color:var(--mu)}
.era.on{background:#e9e3d2;color:#151b22}.era.on i{color:#555}
.rowf{display:flex;gap:6px;align-items:center;margin:6px 0}
.ng{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:46vh;overflow:auto}
.ng button{height:auto;display:flex;gap:8px;align-items:center;text-align:left;padding:7px 8px;background:var(--ink2)}.ng button span{display:grid;gap:2px}.ng button small{font-weight:400;color:var(--mu)}
.ng button.on{background:#e9e3d2;color:#151b22}.ng button.on small{color:#555}
.fl svg,.flg{display:block;flex:none;border:1px solid #0009}.bar .flg,.plate .flg{outline:1px solid #ffffff38}
/* ── 플레이 화면 ── */
.play{position:fixed;inset:0;display:grid;grid-template-rows:48px 1fr;grid-template-columns:64px 1fr}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 10px 0 8px;background:var(--ink);border-bottom:1px solid #000;z-index:5;min-width:0}
.bar .me{display:flex;align-items:center;gap:9px;min-width:0}.bar .me b{font:700 17px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{flex:1;display:flex;justify-content:center;gap:4px;min-width:0}
.rs{display:flex;align-items:baseline;gap:6px;padding:4px 12px;border-left:1px solid #2c3944;white-space:nowrap}.rs:first-child{border-left:0}
.rs small{font:500 11px var(--sans);color:var(--mu)}.rs b{font:700 16px var(--sans);font-variant-numeric:tabular-nums}.rs.sub b{font-size:13px;color:#c8cdd0}
.dl{font:700 11px var(--sans);font-variant-numeric:tabular-nums;animation:dl 7s forwards}.dl.n{color:var(--bad)}.dl.p{color:var(--ok)}@keyframes dl{0%,80%{opacity:1}100%{opacity:0}}
.date{text-align:right;white-space:nowrap}.date b{display:block;font:700 15px var(--sans)}.date small{color:var(--mu);font-size:11px}
#rdy{height:34px;min-width:118px;font-size:13px}#rdy.wait{background:#24303a;border-color:#3d4a56;color:#b9c0c4}
.tabs{background:var(--ink);border-right:1px solid #000;display:flex;flex-direction:column;gap:5px;padding:8px 6px;z-index:4}
.tb{position:relative;height:52px;width:100%;padding:0;display:grid;place-items:center;background:#2a333b;color:#c3c9cc;border:1px solid #47525b;border-top-color:#6b757d;border-bottom-color:#12171b;border-radius:1px;font:600 13px var(--sans);letter-spacing:.06em}
.tb::before,.tb::after{content:'';position:absolute;top:4px;width:3px;height:3px;border-radius:50%;background:#59646c}.tb::before{left:4px}.tb::after{right:4px}
.tb.on{background:#ebe5d4;color:#141a20;border-color:#fff #cfc7b2 #a59c86}.tb.on::before,.tb.on::after{background:#a59c86}
.tb .env{position:absolute;right:-5px;top:-5px;width:16px;height:12px}
.tabs .sp{flex:1}.tb.sm{height:34px;font-size:11px}
.mapw{position:relative;overflow:hidden;background:var(--sea)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}#map:active{cursor:grabbing}
.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.5}
/* 지도 요소 */
.sea{fill:var(--sea)}
#grat path{stroke:#7f969d;stroke-width:.6;fill:none;vector-effect:non-scaling-stroke;opacity:.55}
.h1,.h2{fill:none;stroke-linejoin:round;vector-effect:non-scaling-stroke}.h1{stroke:#8ea4ab;stroke-width:5}
.c>path{stroke:#6e3f35;stroke-opacity:.7;stroke-width:.9;stroke-dasharray:4 1.6 1 1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer}
.c:hover>path:first-child{filter:brightness(1.05) saturate(1.1)}
.c.fl>path:first-child{animation:fl 1.2s ease-in-out 4}@keyframes fl{50%{filter:brightness(.82) saturate(1.6)}}
.ci{fill:none;stroke:#5c4a33;stroke-opacity:.28;stroke-width:7;vector-effect:non-scaling-stroke}.co{fill:none;stroke:#3f4b4f;stroke-width:.9;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#copies{pointer-events:none}
#map.mv .h1,#map.mv .h2,#map.mv .ci,#map.mv #grat,#map.mv .mt,#map.mv .usl,#map.mv .lake,#map.mv .riv,#map.mv #copies{display:none}#map.mv .c>path{stroke-dasharray:none}.mapw.mv .grain{display:none}
.mt{stroke:#6d5639;stroke-width:.9;fill:none;vector-effect:non-scaling-stroke;opacity:.75}
.lake{fill:#a7b9be;stroke:#3f4b4f;stroke-width:.7;vector-effect:non-scaling-stroke}
.riv{fill:none;stroke:#6f8f9a;stroke-width:1.1;vector-effect:non-scaling-stroke}
.usl{fill:none;stroke:#6e3f35;stroke-width:.8;stroke-dasharray:2 2;vector-effect:non-scaling-stroke;opacity:.6}
.rail0{fill:none;stroke:#2b2721;stroke-width:3;vector-effect:non-scaling-stroke}.rail1{fill:none;stroke:#efe6cf;stroke-width:1.5;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.railp{fill:none;stroke:#2b2721;stroke-width:1.6;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
.railn{fill:none;stroke:#7a2a1a;stroke-width:4.4;vector-effect:non-scaling-stroke}.railb{fill:none;stroke:var(--acc);stroke-width:3.4;vector-effect:non-scaling-stroke}
.grid0{fill:none;stroke:#7b5a12;stroke-width:2;vector-effect:non-scaling-stroke}.gridp{fill:none;stroke:#7b5a12;stroke-width:1.6;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.rt{fill:none;stroke:#2f4d66;stroke-width:1.6;stroke-dasharray:1.5 4;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.8}
.rt.hot{stroke:#a3361b;stroke-width:2.6;stroke-dasharray:6 3;opacity:1}.rt.off{opacity:.18}.rt.cut{stroke:#7a2a1a;stroke-dasharray:2 5;opacity:.5}
.rth{fill:none;stroke:transparent;stroke-width:12;vector-effect:non-scaling-stroke;cursor:pointer}
.net{fill:none;stroke:#5a2d68;stroke-width:1.4;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;opacity:.8}.net.hot{stroke:#a3361b;stroke-width:2.4;opacity:1}
.zone{fill:transparent;stroke:#7b5a12;stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;cursor:pointer}.zone:hover,.zone.on{fill:#c9a33a33;stroke-width:2}
.gridz{fill:url(#gridhatch);stroke:none;pointer-events:none}
.dimm{fill:#e6dcc2;fill-opacity:.62;fill-rule:evenodd;pointer-events:none}
.selr{fill:none;stroke:#a3361b;stroke-width:2.4;vector-effect:non-scaling-stroke;pointer-events:none}
.selr2{fill:none;stroke:#fff8e6;stroke-width:5;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.8}
.front{fill:none;stroke:#9b2a17;stroke-width:2.6;vector-effect:non-scaling-stroke;pointer-events:none}.frm{fill:none;stroke:#1f2a33;stroke-width:1.6;vector-effect:non-scaling-stroke;pointer-events:none}
.tgt{fill:#a3361b14;stroke:#a3361b;stroke-width:1.8;stroke-dasharray:5 3;vector-effect:non-scaling-stroke;cursor:crosshair}.tgt:hover{fill:#a3361b33}
.arw{fill:none;stroke:#a3361b;stroke-width:3;vector-effect:non-scaling-stroke;marker-end:url(#ah)}.arw.p{stroke-dasharray:7 4}
.cmpb{fill:#4f7a45;stroke:#fff8e6;stroke-width:1.2}.cmpl{fill:#7a6a55;stroke:#fff8e6;stroke-width:1.2}
.nl{font-family:var(--serif);font-weight:700;fill:#4b3b2a;fill-opacity:.58;letter-spacing:.32em;text-anchor:middle;pointer-events:none}
#map:not(.z1) .l1,#map:not(.z2) .l2,#map:not(.z3) .l3{display:none}
#map:not(.z2) .ft:not(.cap):not(.own) text,#map:not(.z1) .ft.cap:not(.own) text{display:none}
.ft{cursor:pointer}.ft text{font:500 11px var(--sans);fill:#2a241c;paint-order:stroke;stroke:#efe6cf;stroke-width:3px;stroke-linejoin:round}
.ft.cap text{font-weight:700;font-size:12.5px}.ft.port text,.ft.fac text{font-weight:600}
.ft.dim{opacity:.28}.ft.occ text{fill:#7a2a1a}
.ft .bgc{fill:#efe6cf;stroke:#2a241c;stroke-width:.8}
.ring{fill:none;stroke:#a3361b;stroke-width:1.6}.ring2{fill:none;stroke:#a3361b;stroke-width:.8;opacity:.6}
.ctr{cursor:pointer}.ctr text{font:700 10px var(--sans);fill:#141414}.ctr.sel rect.b{stroke:#a3361b;stroke-width:2.4}.ctr.en{cursor:default}
.pulse{fill:none;stroke:#a3361b;stroke-width:2;animation:pu 1.6s ease-out 4;transform-box:fill-box;transform-origin:center}@keyframes pu{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.4);opacity:0}}
/* 지도 위 조작부 */
.plate{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:9px;background:var(--ink);border:1px solid #000;padding:6px 12px 6px 6px;z-index:3;max-width:calc(100% - 24px)}
.plate b{font:700 16px var(--serif);white-space:nowrap}.plate small{color:var(--mu);font-size:11px;white-space:nowrap}.plate .vt{font:600 10px var(--sans);letter-spacing:.1em;border:1px solid #6a7884;padding:2px 5px;color:#c8cdd0}
.zm{position:absolute;left:12px;top:64px;display:grid;gap:3px;z-index:3}.zm button{width:32px;height:32px;padding:0;font-size:16px;background:var(--ink)}
#tags .et{position:absolute;transform:translate(-50%,-50%);font:600 11px var(--sans);color:#1f3550;background:#efe6cfe8;border:1px solid #2f4d66;padding:2px 6px;white-space:nowrap;cursor:pointer;z-index:2}
#tags .et.hot{color:#fff;background:#a3361b;border-color:#a3361b}
.pop{position:absolute;z-index:6;background:var(--ink);border:1px solid #000;padding:10px 12px;width:250px;transform:translate(-50%,calc(-100% - 18px));box-shadow:0 3px 0 #0003}
.pop::after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.pop h5{margin:0 0 4px;font:700 13px var(--sans)}.pop .st{font:600 10px var(--sans);letter-spacing:.1em;color:var(--mu);margin-bottom:6px}.pop .st i{font-style:normal;color:var(--acc2)}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:6px 0 8px;font-size:12px}.pop dt{color:var(--mu)}.pop dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.pop .rowf{justify-content:flex-end}
.sheet{position:absolute;left:12px;bottom:12px;width:min(430px,calc(100% - 24px));max-height:min(62%,560px);display:flex;flex-direction:column;background:var(--ink2);border:1px solid #000;z-index:4;transform:translateY(calc(100% + 24px));transition:transform .2s ease-out;box-shadow:0 3px 0 #0003}
.sheet.on{transform:none}.sheet.min{transform:translateY(calc(100% - 46px))}
.sh{display:flex;align-items:center;gap:9px;padding:8px 8px 8px 12px;border-bottom:1px solid #000;background:var(--ink);min-height:46px;cursor:pointer}
.sh .ic{width:26px;height:26px;flex:none}.sh b{font:700 15px var(--sans);display:block}.sh small{color:var(--mu);font-size:11px}.sh>div{flex:1;min-width:0}
.sh button{width:30px;padding:0;font-size:14px;background:transparent;border-color:#3a4855}
.sb{overflow:auto;padding:10px 12px 12px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#000;border:1px solid #000;margin-bottom:10px}.kv div{background:var(--ink3);padding:6px 8px}.kv small{display:block;color:var(--mu);font-size:10.5px}.kv b{font:700 15px var(--sans);font-variant-numeric:tabular-nums}
.sec{font:600 10.5px var(--sans);letter-spacing:.12em;color:var(--mu);margin:12px 0 5px;display:flex;justify-content:space-between}
.ln{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #2c3944;font-size:12.5px}.ln:last-child{border-bottom:0}.ln .g{flex:1;min-width:0}.ln small{color:var(--mu);display:block;font-size:11px}
.ln .v{font:700 13px var(--sans);font-variant-numeric:tabular-nums;text-align:right}
.ln.cl{cursor:pointer}.ln.cl:hover{background:#ffffff08}.ln.hot{background:#c4532d22}
.bar2{height:6px;background:#0c1116;border:1px solid #000;position:relative}.bar2 i{position:absolute;inset:0 auto 0 0;background:#9fb3a0}.bar2 i.u{background:#c9a33a}
.cmds{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.cmds button{flex:1 1 auto}
.tag{display:inline-block;font:600 10px var(--sans);padding:2px 5px;border:1px solid #6a7884;color:#c8cdd0;letter-spacing:.04em;vertical-align:1px}.tag.bad{border-color:var(--bad);color:var(--bad)}.tag.ok{border-color:var(--ok);color:var(--ok)}.tag.acc{border-color:var(--acc2);color:var(--acc2)}
.warn{background:#3a1d16;border:1px solid #7a2a1a;color:#f0c2b2;padding:7px 9px;font-size:12px;margin-bottom:8px}
.note{color:var(--mu);font-size:11.5px;margin-top:6px}
.opt{display:grid;grid-template-columns:1fr auto;gap:0 8px;width:100%;height:auto;text-align:left;padding:7px 9px;margin:3px 0;background:var(--ink3)}.opt small{grid-column:1;font-weight:400;color:var(--mu);margin-top:2px}.opt.on{background:#e9e3d2;color:#151b22}.opt.on small{color:#555}
/* 문서 패널(종이) */
.doc{position:absolute;right:12px;top:12px;bottom:96px;width:min(380px,42%);display:none;flex-direction:column;background:var(--paper2);color:var(--pink);border:1px solid #4a4030;z-index:3;box-shadow:0 3px 0 #0002}
.doc.on{display:flex}
.dh{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--tx);padding:0 6px 0 12px;height:38px;flex:none}.dh b{flex:1;font:700 13px var(--sans);letter-spacing:.04em}.dh button{width:28px;padding:0;height:26px;background:transparent}
.db{overflow:auto;padding:10px 14px 14px;flex:1}
.db .sec{color:#6d6250}.db .ln{border-bottom-color:#d6cbb0}.db .ln small{color:#6d6250}.db .ln.cl:hover{background:#00000008}.db .ln.hot{background:#c4532d1f}.db .note{color:#6d6250}
.db button{background:#2a333b;color:#eee;border-color:#1b2026}.db button.pri{background:var(--acc);border-color:#8f3a22}.db button.on{background:#151d26;color:#fff;border-color:#000;outline:2px solid var(--acc)}
.db .opt{background:#e6dcc4;color:var(--pink);border-color:#bcae8e}.db .opt small{color:#6d6250}.db .opt.on{background:#151d26;color:#fff}.db .opt.on small{color:#aab}
.db .kv{background:#bcae8e;border-color:#bcae8e}.db .kv div{background:#e9e0c9}.db .kv small{color:#6d6250}
.ledger{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}.ledger th{font:600 10.5px var(--sans);color:#6d6250;text-align:left;border-bottom:1.5px solid #4a4030;padding:4px 3px}.ledger td{border-bottom:1px solid #d6cbb0;padding:5px 3px;vertical-align:top}.ledger td.r,.ledger th.r{text-align:right}
.ledger tr.cl{cursor:pointer}.ledger tr.cl:hover td{background:#00000008}.ledger tr.hot td{background:#c4532d24}
.ledger .stp{display:inline-flex;gap:2px;margin-left:6px}.ledger .stp button{width:22px;height:22px;padding:0;font-size:13px}
.db button.letter,.sb button.letter{background:#f7f1e0;color:var(--pink);border-color:#bcae8e;border-left-color:#5a2d68}.db button.letter.hot,.sb button.letter.hot{background:#fff;border-left-color:var(--acc)}
.letter{display:block;width:100%;height:auto;text-align:left;background:#f7f1e0;color:var(--pink);border:1px solid #bcae8e;border-left:4px solid #5a2d68;padding:8px 10px;margin:6px 0;font:400 12px/1.45 var(--sans)}
.letter b{font:700 13px var(--sans);display:block}.letter small{color:#6d6250}.letter.hot{border-left-color:var(--acc);background:#fff}.letter.new b::after{content:' · 새 서신';color:var(--acc);font-size:11px}
.treaty{border:1px solid #8c7d5e;background:#f7f1e0;margin:8px 0}.treaty>button{display:block;width:100%;height:auto;text-align:left;background:transparent;color:var(--pink);border:0;padding:9px 10px}
.treaty h6{margin:0;font:700 15px var(--serif)}.treaty small{color:#6d6250;font-weight:400}
.treaty ol{margin:0;padding:4px 12px 4px 30px;font-size:12px;border-top:1px dashed #bcae8e}.treaty li{margin:5px 0}.treaty li.mod{background:#c4532d1a;outline:1px dashed #a3361b;outline-offset:2px}.treaty li.mod::after{content:' — 상대측 수정';color:#a3361b;font-size:11px}
.treaty .rowf{padding:0 10px 10px;justify-content:flex-end}
.agenda{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;max-width:min(400px,calc(100% - 24px));background:var(--ink);border:1px solid #000;border-left:3px solid var(--acc);padding:8px 10px 8px 11px;cursor:pointer;z-index:3}
.agenda small{display:block;font:600 10px var(--sans);letter-spacing:.12em;color:var(--acc2)}.agenda b{font:600 13px var(--sans);display:block}.agenda span{color:var(--mu);font-size:11.5px}
.agenda .go{font-size:16px;color:var(--mu)}
/* 신문 */
.news{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0b0f1488;padding:16px}
.paperN{width:min(660px,100%);max-height:92vh;overflow:auto;background:#efe7d2;color:#18140f;border:1px solid #5f5440;padding:16px 22px 18px;transform-origin:50% 0;animation:nin .3s ease-out}
@keyframes nin{from{transform:translateY(16px);opacity:0}}
.paperN.fold{animation:nfold .45s ease-in forwards}@keyframes nfold{to{transform:perspective(900px) rotateX(78deg) scale(.55);opacity:0}}
.mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double #18140f;padding-bottom:6px}.mast b{font:900 26px var(--serif);letter-spacing:.08em}.mast small{font-size:11px}
.hl{display:block;width:100%;height:auto;text-align:left;background:transparent;border:0;color:inherit;padding:12px 0 6px;cursor:pointer}
.hl h2{margin:0;font:900 clamp(26px,5.4vw,42px)/1.15 var(--serif);letter-spacing:-.01em}.hl:hover h2{text-decoration:underline;text-decoration-thickness:2px}
.hl p{margin:8px 0 0;font:400 13.5px/1.6 var(--sans);color:#3a3226}.hl .go{font:600 11px var(--sans);color:#a3361b;margin-top:6px;display:block}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px;border-top:1px solid #18140f;padding-top:8px;margin-top:8px}.cols div{font-size:12px;line-height:1.45;color:#3a3226}.cols b{display:block;font:700 13.5px var(--serif);color:#18140f;margin-bottom:2px}
